models:
  - name: STG_NEWS_SENTIMENT
    description: >
      Per-article sentiment score produced by the NLP Batch Transform
      pipeline (src/nlp/). Joined into MART_STOCK_SENTIMENT_SCORES by
      ARTICLE_ID. Granularity: Article.
    config:
      meta:
        dagster:
          asset_key:
            - STAGING
            - STG_NEWS_SENTIMENT
    columns:
      - name: ARTICLE_ID
        data_type: VARCHAR(256)
        data_tests:
          - not_null
          - unique
      - name: SENTIMENT_SCORE
        data_type: NUMERIC(18, 4)
        description: Sentiment score in [-1, 1]; P(positive) - P(negative).
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -1
                max_value: 1
      - name: SENTIMENT_LABEL
        data_type: VARCHAR(32)
      - name: MODEL_VERSION
        data_type: VARCHAR(256)
      - name: BATCH_DATE
        data_type: DATE
      - name: DATACORE_CREATE_DATETIME
        data_type: TIMESTAMP
      - name: DATACORE_CREATE_PROGRAM
        data_type: VARCHAR(256)
      - name: DATACORE_CREATE_BY
        data_type: VARCHAR(256)
      - name: DATACORE_UPDATE_DATETIME
        data_type: TIMESTAMP
      - name: DATACORE_UPDATE_PROGRAM
        data_type: VARCHAR(256)
      - name: DATACORE_UPDATE_BY
        data_type: VARCHAR(256)
