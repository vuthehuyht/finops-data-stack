version: 2
sources:
  - name: RAW
    description: Raw data source for RAW
    schema: "{{ env_var('REDSHIFT_SCHEMA_RAW', 'raw') }}"
    tables:
      - name: RAW_NEWS_SENTIMENT
        description: Raw data source for RAW_NEWS_SENTIMENT
        config:
          meta:
            dagster:
              asset_key:
                - RAW
                - RAW_NEWS_SENTIMENT
        columns:
          - name: ARTICLE_ID
            data_type: VARCHAR(256)
          - name: SENTIMENT_SCORE
            data_type: NUMERIC(18, 4)
          - name: SENTIMENT_LABEL
            data_type: VARCHAR(32)
          - name: MODEL_VERSION
            data_type: VARCHAR(256)
          - name: BATCH_DATE
            data_type: DATE
          - name: _CONATA_SOURCE
            data_type: VARCHAR(256)
          - name: _CONATA_SOURCE_ROW_NUMBER
            data_type: INTEGER
          - name: _CONATA_PARTITION_KEY
            data_type: VARCHAR(256)
          - name: _CONATA_LOADED_AT
            data_type: TIMESTAMP
