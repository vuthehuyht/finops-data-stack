[project]
name = "finops-data-stack"
version = "0.1.0"
description = "Automated Data Pipeline for Vietnam Stock Market analysis and valuation."
readme = "README.md"
authors = [
    { name = "Vu The Huy", email = "vuthehuy.t61@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dagster==1.13.10",
    "dagster-aws==0.29.10",
    "dagster-dbt==0.29.10",
    "dagster-pandas==0.29.10",
    # Floors chosen so sqlparse can resolve to >=0.6.0, which fixes
    # GHSA-pwgv-4x5q-6m9f, GHSA-prg7-hcfm-mfcr, GHSA-f2ff-p2ww-7p4p and
    # GHSA-3496-9g83-7v6x. dbt-core 1.11.14 and dbt-redshift 1.11.1 are the
    # first releases that relax their own sqlparse pin from <0.6.0 to <0.7.0.
    "dbt-redshift>=1.11.1",
    "dbt-core>=1.11.14",
    "vnstock>=4.0.4",
    "pandas>=2.2.0",
    "httpx>=0.27.0",
    "boto3>=1.43.54",
    "urllib3>=2.4.0",
    "numpy>=1.26.0",
    "mypy-boto3-s3>=1.43.50",
    "pyarrow>=17.0.0",
    "more-itertools>=10.8.0",
    "mashumaro>=3.9,<3.15",
    "dagster-k8s==0.29.10",
    "dagster-slack==0.29.10",
    "prometheus-client>=0.25.0",
    "psutil>=7.2.2",
    "yfinance>=1.4.1",
    "sagemaker>=3.16.0",
    "dagster-postgres>=0.29.10",
    "dagster-webserver>=1.13.10",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "dagster-graphql",
    "ruff>=0.15.22",
    "mypy>=1.0.0",
    "ipykernel",
    "pytest-mock>=3.15.1",
    "sqlfluff>=3.0.0",
    "sqlfluff-templater-dbt>=3.0.0",
    "pre-commit>=4.6.0",
]
dagster = [
    "dagster-webserver==1.13.10",
]
ml = [
    "torch>=2.13.0",
    "sagemaker>=3.16.0",
]

[tool.dagster]
module_name = "src.dagster.workspace"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.isort]
force-single-line = false
split-on-trailing-comma = true
force-sort-within-sections = false
known-first-party = ["src", "scripts"]
known-third-party = ["dagster"]

[tool.ruff.lint.per-file-ignores]
"src/pipeline/dagster/__init__.py" = ["I"]

[tool.uv]
# Force deepdiff>=8.0.0 to fix Critical/High CVEs (#21, #23).
# dbt-common pins deepdiff<8.0 but only uses the DeepDiff class (not Delta),
# which remains API-compatible across the 7→8 boundary.
# Also force dbt-common>=1.37.3 to fix path traversal vulnerability (#22).
# Force tornado>=6.5.8 (transitive via ipykernel/jupyter_client) to fix
# GHSA-mpf4-983q-p7j4, GHSA-8423-8fgw-73vq and GHSA-wwv5-g3v4-889x (#65-67).
# Force mlflow>=3.16.0 (transitive via sagemaker-mlflow) to move past the
# vulnerable range reported for GHSA-h7x2-h6g9-p789 (#64) — GitHub has not
# published a first_patched_version for this advisory yet, and mlflow isn't
# imported anywhere in src/ (the AI Gateway server code path it affects is
# never run here), so this bump is best-effort until upstream ships a fix.
override-dependencies = [
    "deepdiff>=8.0.0",
    "dbt-common>=1.37.3",
    "cryptography>=50.0.0",
    "tornado>=6.5.8",
    "mlflow>=3.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
filterwarnings = [
    "ignore:The `__fields__` attribute is deprecated:DeprecationWarning",
    "ignore:Class `MultiAssetSensorDefinition` is superseded:dagster.SupersessionWarning",
]
